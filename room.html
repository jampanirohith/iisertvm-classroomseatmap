<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Classroom - IISER TVM</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="room-page">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="back-btn" href="index.html" aria-label="Back to classrooms">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div class="title-block">
        <h1 id="room-title">Classroom</h1>
        <p id="room-sub"></p>
      </div>
      <a class="add-btn" id="add-event" href="admin.html" hidden>+ Event</a>
      <div class="top-tools">
        <button type="button" class="top-today" id="top-today" hidden>Today</button>
        <button type="button" class="top-cal" id="top-cal" aria-label="Choose a date from the calendar" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
      </div>
    </div>
  </header>

  <div class="event-bar" id="event-bar" hidden>
    <div class="event-bar-inner" id="event-bar-inner">
      <div class="date-nav">
        <button type="button" class="strip-arrow" id="strip-left" aria-label="Previous day">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="date-strip" id="date-strip" aria-label="Choose a date"></div>
        <button type="button" class="strip-arrow" id="strip-right" aria-label="Next day">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button type="button" class="today-btn" id="date-today" hidden>Today</button>
      </div>
      <div class="day-bar" id="day-bar">
        <button type="button" class="day-arrow" id="day-prev" aria-label="Previous day"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="day-strip" id="day-strip" aria-label="Pick a day"></div>
        <button type="button" class="day-arrow" id="day-next" aria-label="Next day"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="pk-pop" id="pk-pop" role="dialog" aria-label="Calendar" hidden></div>
      <div class="event-strip" id="event-strip" aria-label="Events on the selected date"></div>
    </div>
    <button type="button" class="bar-handle" id="bar-handle" aria-expanded="true" aria-controls="event-bar-inner" aria-label="Hide dates and events to see the whole classroom">
      <span class="grab" aria-hidden="true"></span>
      <span class="bar-sum" id="bar-sum"></span>
      <svg class="bar-chev" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

  <main class="layout-main" id="room-body"></main>
  <footer class="room-foot" id="room-foot" hidden></footer>

  <dialog id="seat-dialog">
    <form id="seat-form" method="dialog">
      <h2>Mark seat <span id="seat-no"></span></h2>
      <p class="muted small" id="seat-event"></p>
      <label class="field">Your name or initials<input id="seat-name" maxlength="30" autocomplete="name" required></label>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Mark my seat</button>
      </div>
    </form>
  </dialog>

  <dialog id="seat-info">
    <h2>Seat <span id="info-no"></span></h2>
    <p class="seat-who">Marked by <b id="info-who"></b></p>
    <p class="muted small" id="info-event"></p>
    <div class="dialog-actions"><button type="button" class="btn primary" data-close>Close</button></div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="supabase/config.js"></script>
  <script src="js/format.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cheer.js"></script>
  <script src="js/room.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
