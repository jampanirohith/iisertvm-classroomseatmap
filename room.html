<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#070708" media="(prefers-color-scheme: dark)">
  <title>Classroom - IISER TVM</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="room-page">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="back-btn" href="index.html" aria-label="Back to classrooms">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div class="title-block">
        <h1 id="room-title">Classroom</h1>
        <p id="room-sub"></p>
      </div>
      <a class="add-btn" id="add-event" href="admin.html" hidden>+ Event</a>
    </div>
  </header>

  <div class="event-bar" id="event-bar" hidden>
    <div class="event-bar-inner">
      <div class="date-row">
        <button type="button" class="strip-arrow left" id="strip-left" aria-label="Earlier dates" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="date-strip" id="date-strip" aria-label="Event dates"></div>
        <button type="button" class="strip-arrow right" id="strip-right" aria-label="Later dates" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="event-strip" id="event-strip" aria-label="Events on the selected date"></div>
    </div>
  </div>

  <main class="layout-main" id="room-body"></main>
  <footer class="room-foot" id="room-foot" hidden></footer>

  <dialog id="seat-dialog">
    <form id="seat-form" method="dialog">
      <h2>Mark seat <span id="seat-no"></span></h2>
      <p class="muted small" id="seat-event"></p>
      <label class="field">Your name or initials<input id="seat-name" maxlength="30" autocomplete="name" required></label>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Mark my seat</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="supabase/config.js"></script>
  <script src="js/format.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/room.js"></script>
</body>
</html>
