<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Lecture Hall Complex - IISER TVM</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-bar">
    <div class="site-bar-inner">
      <a class="brand" href="index.html"><img class="brand-icon" src="icons/icon-192.png" alt="" width="36" height="36"><span class="brand-text"><b>Lecture Hall Complex</b><small>IISER Thiruvananthapuram</small></span></a>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html" aria-current="page">Classrooms</a>
        <a href="interactive-map.html">Interactive map</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
  </header>
  <main class="shell">
    <section class="search" aria-label="Search classes and exams">
      <label class="visually-hidden" for="search-input">Search classes and exams</label>
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="search-input" type="search" placeholder="Search classes and exams" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button type="button" id="search-clear" aria-label="Clear search" hidden>&times;</button>
      </div>
      <p class="search-hint" id="search-hint">Try a course code (PHY 212), a hall (Kaumudi), a teacher, or a date (25 Nov, today).</p>
      <div class="filters" id="search-filters" role="group" aria-label="Show" hidden>
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="class" aria-pressed="false">Classes</button>
        <button type="button" data-filter="exam" aria-pressed="false">Exams</button>
        <button type="button" class="past-filter" data-past aria-pressed="false">Show past</button>
      </div>
      <div id="search-results" aria-live="polite"></div>
    </section>

    <div id="home-sections">
      <section aria-labelledby="rooms-title">
        <h1 class="section-title" id="rooms-title">Classrooms</h1>
        <ul class="menu" id="room-list"></ul>
      </section>
      <section class="my-events" id="my-events" aria-labelledby="my-title"></section>
    </div>
  </main>
  <script src="supabase/config.js"></script>
  <script src="js/format.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/home.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
